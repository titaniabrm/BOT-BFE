services:
  - type: web
    name: bfe-dashboard
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health

  - type: worker
    name: bfe-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm run bot:start
    envVars:
      - key: NODE_ENV
        value: production